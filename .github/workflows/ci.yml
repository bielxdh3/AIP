name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - name: Android validation
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          {
            name: aip-android-debug,
            path: android/app/build/outputs/apk/debug/app-debug.apk,
          }
  phase-zero:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Validate Phase H versions
        run: pnpm phase-h:check

      - name: Install Python checks
        run: python -m pip install --disable-pip-version-check pyinstaller -e ".\services\runtime[dev]"

      - name: Validate public repository
        run: pnpm secrets:scan

      - name: Validate TypeScript and frontend
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Validate Python runtime
        run: pnpm python:check

      - name: Validate Rust and Tauri core
        shell: pwsh
        run: |
          .\scripts\build-runtime.ps1
          $output = & pnpm tauri:check 2>&1
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Output $_ }

          if ($exitCode -ne 0) {
            $tail = ($output | Select-Object -Last 80) -join "`n"
            $annotation = $tail.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
            Write-Output "::error title=Rust and Tauri validation failed::$annotation"
            exit $exitCode
          }

  package:
    needs: phase-zero
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build exact-SHA installers
        shell: pwsh
        run: |
          $env:GITHUB_SHA = '${{ github.event.pull_request.head.sha || github.sha }}'
          pnpm install --frozen-lockfile
          python -m pip install --disable-pip-version-check pyinstaller -e ".\services\runtime[dev]"
          .\scripts\build-runtime.ps1
          pnpm --filter @aip/desktop tauri build
          $msiSource = Get-ChildItem apps\desktop\src-tauri\target\release\bundle\msi -Filter *.msi -File | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $msiSource) { throw "Expected MSI artifact for $env:GITHUB_SHA" }
          $msiTarget = Join-Path $msiSource.DirectoryName 'A.I.P._0.2.4.1_x64_en-US.msi'
          if ($msiSource.FullName -ne $msiTarget) { Copy-Item -LiteralPath $msiSource.FullName -Destination $msiTarget -Force }
          $msiSourceHash = (Get-FileHash -LiteralPath $msiSource.FullName -Algorithm SHA256).Hash
          $msiTargetHash = (Get-FileHash -LiteralPath $msiTarget -Algorithm SHA256).Hash
          if ($msiSourceHash -ne $msiTargetHash) { throw "MSI identity-preserving copy changed its SHA256" }
          $nsisSource = Get-ChildItem apps\desktop\src-tauri\target\release\bundle\nsis -Filter *.exe -File | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $nsisSource) { throw "Expected NSIS artifact for $env:GITHUB_SHA" }
          $nsisTarget = Join-Path $nsisSource.DirectoryName 'A.I.P._0.2.4.1_x64-setup.exe'
          if ($nsisSource.FullName -ne $nsisTarget) { Copy-Item -LiteralPath $nsisSource.FullName -Destination $nsisTarget -Force }
          $nsisSourceHash = (Get-FileHash -LiteralPath $nsisSource.FullName -Algorithm SHA256).Hash
          $nsisTargetHash = (Get-FileHash -LiteralPath $nsisTarget -Algorithm SHA256).Hash
          if ($nsisSourceHash -ne $nsisTargetHash) { throw "NSIS identity-preserving copy changed its SHA256" }
          $bundles = @($msiTarget, $nsisTarget) | ForEach-Object { Get-Item -LiteralPath $_ }
          if ($bundles.Count -lt 2) { throw "Expected NSIS and MSI artifacts for $env:GITHUB_SHA" }
          $bundles | ForEach-Object { Write-Output "$($_.Name) $($_.Length) $((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash)" }
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: aip-windows-0.2.4.1-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/A.I.P._0.2.4.1_x64-setup.exe
            apps/desktop/src-tauri/target/release/bundle/msi/A.I.P._0.2.4.1_x64_en-US.msi

  installed-windows-smoke:
    needs: package
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: aip-windows-0.2.4.1-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts\windows
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run installed MSI generation smoke
        shell: pwsh
        run: |
          $msi = Get-ChildItem artifacts\windows -Filter 'A.I.P._0.2.4.1_x64_en-US.msi' -File -Recurse | Select-Object -First 1
          if (-not $msi) { throw 'Exact 0.2.4.1 MSI was not downloaded' }
          .\scripts\installed-windows-smoke.ps1 -MsiPath $msi.FullName

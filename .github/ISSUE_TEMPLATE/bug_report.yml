name: Bug report
description: Report a reproducible problem in AIP
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Remove credentials, private conversations, memories, databases,
        personal paths, and other sensitive data before submitting.

  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or abc1234
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows 11
        - Windows 10
        - Android development build
        - Other
    validations:
      required: true

  - type: input
    id: component
    attributes:
      label: Component
      placeholder: Desktop UI, Rust core, Python runtime, Ollama, Android
    validations:
      required: true

  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Start ...
        2. Open ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or evidence
      description: Include only content that contains no secrets or private user data.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed credentials, private data, local databases, and sensitive paths.
          required: true
        - label: I searched existing issues for the same problem.
          required: true
        - label: This is not an undisclosed security vulnerability.
          required: true
